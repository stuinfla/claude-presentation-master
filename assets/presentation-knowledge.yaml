          align-items: center;
          padding: 5%;
          text-align: center;
        }
        .slide-image-full h2 {
          color: white;
          text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
      HTML: |
        <section class="slide-image-full" data-background-image="images/hero.jpg" data-background-size="cover">
          <div class="image-overlay">
            <h2>Powerful Image Statement</h2>
          </div>
        </section>

    slide_agenda:
      class: "slide-agenda"
      use_for: "Presentation outline, table of contents"
      CSS: |
        .reveal .slides section.slide-agenda {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          padding: 5% 6%;
        }
        .agenda-list {
          list-style: none;
          padding: 0;
          margin-top: 2em;
          width: 100%;
          max-width: 600px;
        }
        .agenda-item {
          display: flex;
          align-items: center;
          gap: 1em;
          padding: 1em 0;
          border-bottom: 1px solid var(--color-border);
        }
        .agenda-number {
          width: 40px;
          height: 40px;
          background: var(--color-accent);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 700;
          color: white;
          flex-shrink: 0;
        }
        .agenda-title {
          font-size: 1.2em;
          font-weight: 500;
        }
        .agenda-time {
          margin-left: auto;
          font-size: 0.85em;
          opacity: 0.6;
        }
      HTML: |
        <section class="slide-agenda">
          <h2>Today's Agenda</h2>
          <ul class="agenda-list">
            <li class="agenda-item">
              <span class="agenda-number">1</span>
              <span class="agenda-title">Introduction & Context</span>
              <span class="agenda-time">5 min</span>
            </li>
            <li class="agenda-item">
              <span class="agenda-number">2</span>
              <span class="agenda-title">Problem Analysis</span>
              <span class="agenda-time">10 min</span>
            </li>
            <li class="agenda-item">
              <span class="agenda-number">3</span>
              <span class="agenda-title">Proposed Solution</span>
              <span class="agenda-time">15 min</span>
            </li>
            <li class="agenda-item">
              <span class="agenda-number">4</span>
              <span class="agenda-title">Q&A</span>
              <span class="agenda-time">10 min</span>
            </li>
          </ul>
        </section>

    slide_testimonials:
      class: "slide-testimonials"
      use_for: "Customer quotes, social proof"
      REQUIRES: "center: false"
      CSS: |
        .reveal .slides section.slide-testimonials {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          padding: 5% 6%;
        }
        .testimonials-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 1.5em;
          margin-top: 2em;
          max-width: 1000px;
        }
        .testimonial-card {
          background: var(--color-bg-secondary);
          border-radius: 12px;
          padding: 1.5em;
          position: relative;
        }
        .testimonial-card::before {
          content: '"';
          font-size: 4em;
          position: absolute;
          top: 0.1em;
          left: 0.2em;
          opacity: 0.1;
          color: var(--color-accent);
        }
        .testimonial-text {
          font-size: 0.9em;
          line-height: 1.6;
          font-style: italic;
          margin-bottom: 1em;
        }
        .testimonial-author {
          display: flex;
          align-items: center;
          gap: 0.75em;
        }
        .testimonial-avatar {
          width: 40px;
          height: 40px;
          border-radius: 50%;
          background: var(--color-accent);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1.2em;
        }
        .testimonial-name {
          font-weight: 600;
          font-size: 0.9em;
        }
        .testimonial-role {
          font-size: 0.75em;
          opacity: 0.7;
        }
      HTML: |
        <section class="slide-testimonials">
          <h2>What Our Customers Say</h2>
          <div class="testimonials-grid">
            <div class="testimonial-card">
              <p class="testimonial-text">This product transformed how we work. We've saved 20 hours per week.</p>
              <div class="testimonial-author">
                <div class="testimonial-avatar">👤</div>
                <div>
                  <div class="testimonial-name">Sarah Chen</div>
                  <div class="testimonial-role">CEO, TechCorp</div>
                </div>
              </div>
            </div>
            <div class="testimonial-card">
              <p class="testimonial-text">The best investment we made this year. ROI was visible within weeks.</p>
              <div class="testimonial-author">
                <div class="testimonial-avatar">👤</div>
                <div>
                  <div class="testimonial-name">Mike Johnson</div>
                  <div class="testimonial-role">CFO, StartupXYZ</div>
                </div>
              </div>
            </div>
            <div class="testimonial-card">
              <p class="testimonial-text">Incredible support team. They helped us onboard in just 2 days.</p>
              <div class="testimonial-author">
                <div class="testimonial-avatar">👤</div>
                <div>
                  <div class="testimonial-name">Lisa Park</div>
                  <div class="testimonial-role">VP Ops, BigCo</div>
                </div>
              </div>
            </div>
          </div>
        </section>

  # ============================================================================
  # DEVICE MOCKUP FRAMES
  # ============================================================================

  device_mockups:

    browser_frame:
      description: "macOS-style browser window"
      CSS: |
        .browser-frame {
          background: linear-gradient(145deg, #1a1a2e, #0d0d1a);
          border-radius: 12px;
          padding: 8px;
          box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .browser-chrome {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 8px 12px;
          background: #252530;
          border-radius: 8px 8px 0 0;
        }
        .browser-dots {
          display: flex;
          gap: 6px;
        }
        .browser-dots span {
          width: 12px;
          height: 12px;
          border-radius: 50%;
        }
        .browser-dots span:nth-child(1) { background: #ff5f57; }
        .browser-dots span:nth-child(2) { background: #ffbd2e; }
        .browser-dots span:nth-child(3) { background: #28ca42; }
        .browser-url {
          flex: 1;
          background: #1a1a24;
          border-radius: 4px;
          padding: 6px 12px;
          font-size: 12px;
          color: #666;
        }
        .browser-content {
          border-radius: 0 0 8px 8px;
          overflow: hidden;
        }
        .browser-content img {
          width: 100%;
          display: block;
        }
      HTML: |
        <div class="browser-frame">
          <div class="browser-chrome">
            <div class="browser-dots"><span></span><span></span><span></span></div>
            <div class="browser-url">https://example.com</div>
          </div>
          <div class="browser-content">
            <img src="images/screenshot.png" alt="Screenshot">
          </div>
        </div>

    phone_frame:
      description: "iPhone-style phone mockup"
      CSS: |
        .phone-frame {
          width: 280px;
          background: linear-gradient(145deg, #1a1a2e, #0d0d1a);
          border-radius: 40px;
          padding: 12px;
          box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .phone-notch {
          width: 120px;
          height: 25px;
          background: #0d0d1a;
          border-radius: 0 0 20px 20px;
          margin: 0 auto;
        }
        .phone-screen {
          background: #fff;
          border-radius: 30px;
          overflow: hidden;
          margin-top: -12px;
        }
        .phone-screen img {
          width: 100%;
          display: block;
        }
        .phone-home-bar {
          width: 100px;
          height: 4px;
          background: #333;
          border-radius: 2px;
          margin: 8px auto;
        }
      HTML: |
        <div class="phone-frame">
          <div class="phone-notch"></div>
          <div class="phone-screen">
            <img src="images/mobile-screenshot.png" alt="Mobile Screenshot">
          </div>
          <div class="phone-home-bar"></div>
        </div>

    laptop_frame:
      description: "MacBook-style laptop mockup"
      CSS: |
        .laptop-frame {
          max-width: 700px;
        }
        .laptop-screen {
          background: linear-gradient(145deg, #1a1a2e, #0d0d1a);
          border-radius: 12px 12px 0 0;
          padding: 12px 12px 0;
        }
        .laptop-screen img {
          width: 100%;
          border-radius: 4px 4px 0 0;
          display: block;
        }
        .laptop-base {
          height: 14px;
          background: linear-gradient(to bottom, #2a2a3e, #1a1a2e);
          border-radius: 0 0 4px 4px;
          position: relative;
        }
        .laptop-base::before {
          content: '';
          position: absolute;
          bottom: 0;
          left: 50%;
          transform: translateX(-50%);
          width: 120px;
          height: 4px;
          background: #333;
          border-radius: 0 0 4px 4px;
        }
        .laptop-shadow {
          height: 20px;
          background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, transparent 70%);
          margin-top: 8px;
        }
      HTML: |
        <div class="laptop-frame">
          <div class="laptop-screen">
            <img src="images/desktop-screenshot.png" alt="Desktop Screenshot">
          </div>
          <div class="laptop-base"></div>
          <div class="laptop-shadow"></div>
        </div>

  # ============================================================================
  # ANIMATION PATTERNS
  # ============================================================================

  animations:

    fade_in:
      CSS: |
        .animate-fade-in {
          animation: fadeIn 0.6s ease-out forwards;
          opacity: 0;
        }
        @keyframes fadeIn {
          to { opacity: 1; }
        }

    slide_up:
      CSS: |
        .animate-slide-up {
          animation: slideUp 0.6s ease-out forwards;
          opacity: 0;
          transform: translateY(30px);
        }
        @keyframes slideUp {
          to { opacity: 1; transform: translateY(0); }
        }

    scale_in:
      CSS: |
        .animate-scale-in {
          animation: scaleIn 0.5s ease-out forwards;
          opacity: 0;
          transform: scale(0.9);
        }
        @keyframes scaleIn {
          to { opacity: 1; transform: scale(1); }
        }

    stagger_children:
      description: "Stagger animations for child elements"
      CSS: |
        .stagger-children > * {
          opacity: 0;
          animation: slideUp 0.5s ease-out forwards;
        }
        .stagger-children > *:nth-child(1) { animation-delay: 0.1s; }
        .stagger-children > *:nth-child(2) { animation-delay: 0.2s; }
        .stagger-children > *:nth-child(3) { animation-delay: 0.3s; }
        .stagger-children > *:nth-child(4) { animation-delay: 0.4s; }
        .stagger-children > *:nth-child(5) { animation-delay: 0.5s; }
        .stagger-children > *:nth-child(6) { animation-delay: 0.6s; }

    reduced_motion:
      description: "Respect user preferences"
      CSS: |
        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
          }
        }

  # ============================================================================
  # RESPONSIVE BREAKPOINTS
  # ============================================================================

  responsive_design:

    breakpoints:
      desktop: "1280px and up"
      tablet: "768px to 1279px"
      mobile: "below 768px"

    tablet_adjustments:
      CSS: |
        @media (max-width: 1279px) {
          .reveal .slides section {
            padding: 4% 5%;
          }
          .three-columns,
          .features-grid {
            grid-template-columns: repeat(2, 1fr);
          }
          .team-grid {
            grid-template-columns: repeat(2, 1fr);
          }
          .pricing-tiers {
            flex-direction: column;
            align-items: center;
          }
          .pricing-tier {
            width: 100%;
            max-width: 350px;
          }
          .pricing-tier.featured {
            transform: none;
            order: -1;
          }
        }

    mobile_adjustments:
      CSS: |
        @media (max-width: 767px) {
          .reveal .slides section {
            padding: 3% 4%;
          }
          .slide-screenshot {
            flex-direction: column !important;
          }
          .screenshot-text,
          .screenshot-frame {
            flex: none !important;
            max-width: 100% !important;
            width: 100% !important;
          }
          .three-columns,
          .features-grid,
          .team-grid,
          .testimonials-grid {
            grid-template-columns: 1fr;
          }
          .comparison-container {
            flex-direction: column;
          }
          .comparison-divider {
            transform: rotate(90deg);
          }
          .timeline {
            flex-direction: column;
            gap: 1em;
          }
          .timeline::before {
            top: 0;
            bottom: 0;
            left: 30px;
            right: auto;
            width: 4px;
            height: auto;
          }
          .process-steps {
            flex-direction: column;
          }
          .process-step::after {
            content: '↓';
            right: 50%;
            top: auto;
            bottom: -0.8em;
            transform: translateX(50%);
          }
        }

  # ============================================================================
  # ACCESSIBILITY REQUIREMENTS
  # ============================================================================

  accessibility:

    focus_states:
      CSS: |
        a:focus-visible,
        button:focus-visible,
        [tabindex]:focus-visible {
          outline: 3px solid var(--color-accent);
          outline-offset: 3px;
        }

    screen_reader_only:
      CSS: |
        .sr-only {
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
          border: 0;
        }

    high_contrast:
      CSS: |
        @media (prefers-contrast: high) {
          :root {
            --color-text-primary: #ffffff;
            --color-text-secondary: #ffffff;
            --color-bg-primary: #000000;
            --color-bg-secondary: #1a1a1a;
          }
        }

    minimum_touch_targets:
      rule: "All interactive elements must be at least 44x44 pixels"
      CSS: |
        button, a, [role="button"] {
          min-height: 44px;
          min-width: 44px;
        }

  # ============================================================================
  # PRINT STYLES FOR PDF EXPORT
  # ============================================================================

  print_styles:
    CSS: |
      @media print {
        .reveal .slides {
          width: 100%;
          height: auto;
        }
        .reveal .slides section {
          page-break-after: always;
          min-height: 100vh;
        }
        .reveal .controls,
        .reveal .progress {
          display: none !important;
        }
        * {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }

