    slide_comparison:
      class: "slide-comparison"
      use_for: "Before/after, us vs them"
      REQUIRES: "center: false"
      CSS: |
        .reveal .slides section.slide-comparison {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          padding: 5% 6%;
        }
        .comparison-container {
          display: flex;
          gap: 2em;
          margin-top: 2em;
          width: 100%;
          max-width: 900px;
        }
        .comparison-side {
          flex: 1;
          padding: 2em;
          border-radius: 16px;
          text-align: center;
        }
        .comparison-side.negative {
          background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
          border: 2px solid rgba(239, 68, 68, 0.3);
        }
        .comparison-side.positive {
          background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.05));
          border: 2px solid rgba(16, 185, 129, 0.3);
        }
        .comparison-label {
          font-size: 0.9em;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          margin-bottom: 1em;
        }
        .negative .comparison-label { color: #ef4444; }
        .positive .comparison-label { color: #10b981; }
        .comparison-icon {
          font-size: 3em;
          margin-bottom: 0.5em;
        }
        .comparison-list {
          list-style: none;
          padding: 0;
          text-align: left;
        }
        .comparison-list li {
          padding: 0.5em 0;
          padding-left: 1.5em;
          position: relative;
          font-size: 0.95em;
        }
        .negative .comparison-list li::before {
          content: '✗';
          position: absolute;
          left: 0;
          color: #ef4444;
        }
        .positive .comparison-list li::before {
          content: '✓';
          position: absolute;
          left: 0;
          color: #10b981;
        }
        .comparison-divider {
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 2em;
          font-weight: 700;
          color: var(--color-accent);
        }
      HTML: |
        <section class="slide-comparison">
          <h2>Why Switch to Us?</h2>
          <div class="comparison-container">
            <div class="comparison-side negative">
              <div class="comparison-label">Before</div>
              <div class="comparison-icon">😫</div>
