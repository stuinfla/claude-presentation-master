      - "Corporate clients"
      - "Board presentations"
      - "Consulting deliverables"
      - "Investment banking"
      - "Traditional audiences"
      - "Offline presenting"

    programmatic_generation:
      javascript:
        pptxgenjs:
          name: "PptxGenJS"
          github: "https://github.com/gitbrent/PptxGenJS"
          stars: "2.4K+ stars"
          description: "Create PowerPoint from JavaScript"
          features:
            - "Text, tables, charts, images"
            - "Shapes, media, hyperlinks"
            - "Master slides"
            - "Works in browser or Node.js"
          install: "npm install pptxgenjs"
          example: |
            import PptxGenJS from 'pptxgenjs';

            const pptx = new PptxGenJS();
            pptx.author = 'Your Name';
            pptx.title = 'Presentation Title';

            // Add a slide
            const slide = pptx.addSlide();

            // Add title
            slide.addText('Hello World!', {
              x: 1, y: 1, w: '80%',
              fontSize: 48,
              color: '1E3A5F',
              bold: true
            });

            // Add bullet points
            slide.addText([
              { text: 'Point 1', options: { bullet: true } },
              { text: 'Point 2', options: { bullet: true } },
              { text: 'Point 3', options: { bullet: true } }
            ], { x: 1, y: 2.5, w: '80%', fontSize: 24 });

            // Save
            pptx.writeFile({ fileName: 'presentation.pptx' });

          slide_types:
            title_slide:
              layout: "TITLE_SLIDE"
              masterName: "TITLE_SLIDE"
            section_header:
              layout: "SECTION_HEADER"
            two_column:
              layout: "TWO_COLUMN"
            blank:
              layout: "BLANK"

          chart_types:
            - "bar"
            - "bar3D"
            - "line"
            - "area"
            - "pie"
            - "doughnut"
            - "scatter"

      python:
        python_pptx:
          name: "python-pptx"
          description: "Create/update PowerPoint in Python"
          install: "pip install python-pptx"
          features:
            - "Full PowerPoint manipulation"
            - "Shapes, tables, charts"
            - "Master slides"
            - "Notes"
          example: |
            from pptx import Presentation
            from pptx.util import Inches, Pt
            from pptx.dml.color import RgbColor
            from pptx.enum.text import PP_ALIGN

            prs = Presentation()

            # Title slide
            title_layout = prs.slide_layouts[0]
            slide = prs.slides.add_slide(title_layout)

            title = slide.shapes.title
            title.text = "Presentation Title"

            subtitle = slide.placeholders[1]
            subtitle.text = "Your subtitle here"

            # Content slide
            content_layout = prs.slide_layouts[1]
            slide = prs.slides.add_slide(content_layout)

            title = slide.shapes.title
            title.text = "Key Points"

            body = slide.placeholders[1]
            tf = body.text_frame
            tf.text = "First point"

            p = tf.add_paragraph()
            p.text = "Second point"
            p.level = 0

            prs.save('presentation.pptx')

  google_slides:
    name: "Google Slides"
    description: "Cloud-based presentation platform"
    advantages:
