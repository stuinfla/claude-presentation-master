# ==============================================================================
# HTML PRESENTATION TEMPLATES
# ==============================================================================

html_templates:
  reveal_js:
    keynote_mode:
      description: "Minimal, high-impact slides for inspiring presentations"
      template: |
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>{{title}}</title>
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.0/dist/reveal.css">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.0/dist/theme/white.css">
          <style>
            :root {
              --bg: {{background}};
              --primary: {{primary}};
              --secondary: {{secondary}};
              --accent: {{accent}};
              --text: {{text}};
            }
            .reveal { background: var(--bg); }
            .reveal h1, .reveal h2 {
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
              color: var(--primary);
              text-transform: none;
              letter-spacing: -0.02em;
              font-weight: 700;
            }
            .reveal h1 { font-size: 3.5em; }
            .reveal h2 { font-size: 2.5em; }
            .reveal p {
              font-family: Georgia, 'Times New Roman', serif;
              font-size: 1.4em;
              color: var(--text);
              line-height: 1.6;
            }
            .reveal .accent { color: var(--accent); }
            .reveal .big-number {
              font-size: 8em;
              font-weight: 800;
              color: var(--accent);
              margin: 0;
            }
            .reveal blockquote {
              border-left: 4px solid var(--accent);
              padding-left: 2rem;
              background: transparent;
              box-shadow: none;
            }
            .reveal section { padding: 40px 60px; }
          </style>
        </head>
        <body>
          <div class="reveal">
            <div class="slides">
              {{slides}}
            </div>
          </div>
          <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.0/dist/reveal.js"></script>
          <script>
            Reveal.initialize({
              hash: true,
              transition: 'fade',
              transitionSpeed: 'slow',
              controls: true,
              progress: true,
              center: true,
              width: 1920,
              height: 1080
            });
          </script>
        </body>
        </html>

      slide_types:
        title:
          html: |
            <section data-background-color="{{background}}">
              <h1>{{title}}</h1>
              <p>{{subtitle}}</p>
            </section>

        single_statement:
          html: |
            <section data-background-color="{{background}}">
              <h2>{{statement}}</h2>
            </section>

        big_number:
          html: |
            <section data-background-color="{{background}}">
              <p class="big-number">{{number}}</p>
              <p>{{context}}</p>
            </section>

        quote:
          html: |
            <section data-background-color="{{background}}">
              <blockquote>
                <p>"{{quote}}"</p>
                <cite>— {{attribution}}</cite>
              </blockquote>
            </section>

        full_image:
          html: |
            <section data-background-image="{{image_url}}" data-background-size="cover">
              <h2 style="background: rgba(0,0,0,0.5); padding: 20px; color: white;">{{caption}}</h2>
            </section>

        three_points:
          html: |
            <section data-background-color="{{background}}">
              <h2>{{headline}}</h2>
              <div style="display: flex; gap: 3rem; justify-content: center; margin-top: 2rem;">
                <div style="flex: 1; text-align: center;">
                  <p class="accent" style="font-size: 3em; font-weight: bold;">1</p>
                  <p>{{point1}}</p>
                </div>
                <div style="flex: 1; text-align: center;">
                  <p class="accent" style="font-size: 3em; font-weight: bold;">2</p>
                  <p>{{point2}}</p>
                </div>
                <div style="flex: 1; text-align: center;">
                  <p class="accent" style="font-size: 3em; font-weight: bold;">3</p>
                  <p>{{point3}}</p>
                </div>
              </div>
            </section>

        call_to_action:
          html: |
            <section data-background-color="{{primary}}">
              <p style="color: {{background}}; font-size: 1.2em; opacity: 0.9;">{{context}}</p>
              <h2 style="color: {{accent}}; font-size: 3em;">{{action}}</h2>
            </section>

    business_mode:
      description: "Detailed consulting-style slides with action titles"
      template: |
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>{{title}}</title>
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.0/dist/reveal.css">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.0/dist/theme/white.css">
          <style>
            :root {
              --bg: {{background}};
              --primary: {{primary}};
              --secondary: {{secondary}};
              --accent: {{accent}};
              --text: {{text}};
            }
            .reveal { background: var(--bg); }
            .reveal h2 {
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
              color: var(--primary);
              text-transform: none;
              text-align: left;
              font-size: 1.4em;
              font-weight: 600;
              border-bottom: 3px solid var(--accent);
              padding-bottom: 15px;
              margin-bottom: 30px;
            }
            .reveal section {
              text-align: left;
              padding: 40px 60px;
            }
            .reveal p, .reveal li {
              font-family: -apple-system, BlinkMacSystemFont, sans-serif;
              font-size: 0.85em;
              color: var(--text);
              line-height: 1.6;
            }
            .reveal .source {
              font-size: 0.65em;
              color: var(--secondary);
              position: absolute;
              bottom: 20px;
              left: 60px;
            }
            .reveal table {
              font-size: 0.75em;
              width: 100%;
              border-collapse: collapse;
            }
            .reveal th {
              background: var(--primary);
              color: white;
              padding: 12px;
              text-align: left;
            }
            .reveal td {
              border: 1px solid #e5e7eb;
              padding: 10px;
            }
            .reveal tr:nth-child(even) {
              background: #f9fafb;
            }
            .reveal .callout {
              background: var(--accent);
              color: white;
              padding: 15px 20px;
              border-radius: 4px;
              font-weight: 600;
            }
            .reveal .columns {
              display: flex;
              gap: 2rem;
            }
            .reveal .column {
              flex: 1;
            }
          </style>
        </head>
        <body>
          <div class="reveal">
            <div class="slides">
              {{slides}}
            </div>
          </div>
          <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.0/dist/reveal.js"></script>
          <script>
            Reveal.initialize({
              hash: true,
              transition: 'none',
              controls: true,
              progress: true,
              center: false,
              width: 1920,
              height: 1080
            });
          </script>
        </body>
        </html>

      slide_types:
        executive_summary:
          html: |
            <section data-background-color="{{background}}">
              <h2>{{action_title}}</h2>
              <div class="columns">
                <div class="column">
                  <h3 style="color: var(--primary); font-size: 1em; margin-bottom: 1rem;">SITUATION</h3>
                  <ul style="list-style: none; padding: 0;">
                    {{situation_points}}
                  </ul>
                </div>
                <div class="column">
                  <h3 style="color: var(--primary); font-size: 1em; margin-bottom: 1rem;">COMPLICATION</h3>
                  <ul style="list-style: none; padding: 0;">
                    {{complication_points}}
                  </ul>
                </div>
                <div class="column">
                  <h3 style="color: var(--primary); font-size: 1em; margin-bottom: 1rem;">RESOLUTION</h3>
                  <ul style="list-style: none; padding: 0;">
                    {{resolution_points}}
                  </ul>
                </div>
              </div>
              <p class="source">Source: {{source}}</p>
            </section>

        data_insight:
          html: |
            <section data-background-color="{{background}}">
              <h2>{{action_title}}</h2>
              <div class="columns">
                <div class="column" style="flex: 2;">
                  <!-- Chart placeholder -->
                  <div style="background: #f3f4f6; height: 400px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
                    <p style="color: var(--secondary);">[Chart: {{chart_description}}]</p>
                  </div>
                </div>
                <div class="column">
                  <div class="callout">KEY INSIGHT</div>
                  <ul style="margin-top: 1rem;">
                    {{insight_points}}
                  </ul>
                </div>
              </div>
              <p class="source">Source: {{source}}</p>
