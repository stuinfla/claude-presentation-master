                <li>SLA guarantee</li>
              </ul>
            </div>
          </div>
        </section>

    slide_team:
      class: "slide-team"
      use_for: "Team members, leadership"
      REQUIRES: "center: false"
      CSS: |
        .reveal .slides section.slide-team {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          padding: 5% 6%;
        }
